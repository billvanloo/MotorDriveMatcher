<script>

// ecosystem/prediction-log.js v1.1.0
// Prediction Log record format (spec 07 Part A). Pure functions, no DOM.
// Every tool writes records through this module so the Collector can merge them.
const PredictionLog = (function () {
  'use strict';
  const SCHEMA = 'prediction-log';
  const SCHEMA_VERSION = 1;
  const FIELDS = ['schema', 'schemaVersion', 'tool', 'toolVersion', 'student', 'team', 'classPeriod',
    'problemId', 'quantity', 'unit', 'predicted', 'model', 'measured', 'pctPredVsModel',
    'pctMeasVsModel', 'attempt', 'timestamp', 'inputs', 'note'];
  const NUMERIC = ['predicted', 'model', 'measured', 'pctPredVsModel', 'pctMeasVsModel'];
  const NEWER_WARNING = 'made by a newer tool version; some fields may be ignored';

  const isNum = v => typeof v === 'number' && isFinite(v);

  // (value − reference) ÷ reference × 100; null when either is missing or the reference is 0 (00 §3).
  function pctDiff(value, reference) {
    if (!isNum(value) || !isNum(reference) || reference === 0) return null;
    return (value - reference) / reference * 100;
  }

  // ISO 8601 local time with offset, e.g. 2026-09-27T14:03:09-05:00.
  function isoLocal(date) {
    const d = date || new Date();
    const p = n => String(Math.abs(Math.trunc(n))).padStart(2, '0');
    const off = -d.getTimezoneOffset();
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' +
      p(d.getMinutes()) + ':' + p(d.getSeconds()) + (off >= 0 ? '+' : '-') + p(off / 60) + ':' + p(off % 60);
  }

  // Short stable hash (FNV-1a, 32-bit) for sandbox problem IDs.
  function shortHash(obj) {
    const s = typeof obj === 'string' ? obj : stableStringify(obj);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, '0').slice(0, 6);
  }
  function stableStringify(v) {
    if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
    return JSON.stringify(v);
  }
  const sandboxProblemId = inputs => 'sandbox-' + shortHash(inputs);

  // Attempt number for the next record: one more than the highest so far for
  // this student, problem and quantity.
  function nextAttempt(records, student, problemId, quantity) {
    let max = 0;
    for (const r of records) {
      if (r.student === student && r.problemId === problemId && r.quantity === quantity && r.attempt > max) max = r.attempt;
    }
    return max + 1;
  }

  function makeRecord(o) {
    const model = isNum(o.model) ? o.model : null;
    const measured = isNum(o.measured) ? o.measured : null;
    const rec = {
      schema: SCHEMA, schemaVersion: SCHEMA_VERSION,
      tool: String(o.tool || ''), toolVersion: String(o.toolVersion || ''),
      student: (o.student || '').trim() || 'unnamed',
      team: o.team || '', classPeriod: o.classPeriod || '',

      s = Math.abs(r).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
      if (r < 0) s = '-' + s;
    }
    return s.replace(/^-/, '−');
  }
  // Plain number for an input box: up to 6 significant figures, no grouping.
  function fmtInput(v) { return isNum(v) ? String(Number(v.toPrecision(6))) : ''; }
  function fmtPct(p, sig) {
    if (!isNum(p)) return 'not defined';
    return (p > 0 ? '+' : '') + fmtSig(p, sig) + '%';
  }

  // Accepts "1,000", "1 000", "−3", ".5". Returns NaN for anything else.
  function parseNumber(str) {
    if (typeof str === 'number') return str;
    const s = String(str == null ? '' : str).trim().replace(/[−–]/g, '-').replace(/(\d)[,\s](?=\d{3}(\D|$))/g, '$1');
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
    return Number(s);
  }

  // Field validation (00 §8). spec: { name, unit, min, max, gt (exclusive lower bound),
  // integer, check(v) -> message|null }. Returns { value, error }.
  function validateNumber(raw, spec) {
    const name = spec.name || 'This value';
    const u = spec.unit ? ' ' + spec.unit : '';
    if (String(raw == null ? '' : raw).trim() === '') return { value: NaN, error: 'Enter a value for ' + lc(name) + '.' };
    const v = parseNumber(raw);
    if (!isNum(v)) return { value: NaN, error: name + ' must be a number.' };
    if (spec.integer && Math.round(v) !== v) return { value: v, error: name + ' must be a whole number.' };
    if (spec.gt !== undefined && !(v > spec.gt)) return { value: v, error: name + ' must be greater than ' + spec.gt + u + '.' };
    if (spec.min !== undefined && spec.max !== undefined && (v < spec.min || v > spec.max)) return { value: v, error: name + ' must be between ' + fmtBound(spec.min) + ' and ' + fmtBound(spec.max) + u + '.' };
    if (spec.min !== undefined && v < spec.min) return { value: v, error: name + ' must be at least ' + fmtBound(spec.min) + u + '.' };
    if (spec.max !== undefined && v > spec.max) return { value: v, error: name + ' must be at most ' + fmtBound(spec.max) + u + '.' };
    if (spec.check) { const m = spec.check(v); if (m) return { value: v, error: m }; }
    return { value: v, error: null };
  }
  const fmtBound = v => Math.abs(v) >= 10000 ? v.toLocaleString('en-US') : String(v);
  const lc = s => s.charAt(0).toLowerCase() + s.slice(1);

  // 00 §6: <name>_<tool>_<challenge or sandbox>_<YYYY-MM-DD>.<ext>
  function safePart(s) { return String(s || '').trim().replace(/[^A-Za-z0-9._-]+/g, '-').replace(/-+/g, '-').replace(/^[-.]+|[-.]+$/g, ''); }
  function exportName(o) {
    const base = [safePart(o.student) || 'unnamed', safePart(o.tool), safePart(o.context) || 'sandbox', o.dateISO].join('_');
    return o.ext ? base + '.' + o.ext : base;
  }
  function localDateISO(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // 00 §4.5 default bands: within 1% "Match", within 5% "Close".
  function verdictFor(pct, tol) {
    tol = tol || { match: 1, close: 5 };
    if (!isNum(pct)) return null;
    const a = Math.abs(pct);
    return a <= tol.match ? 'match' : a <= tol.close ? 'close' : 'off';
  }
  function predictionMessage(pred, model, unit, sig, reason) {
    const u = unit ? ' ' + unit : '';
    if (!isNum(model)) return 'You predicted ' + fmtSig(pred, sig) + u + '. The model value is not defined' + (reason ? ': ' + reason : '') + '.';
    const pct = PL.pctDiff(pred, model);
    return 'You predicted ' + fmtSig(pred, sig) + u + '. The model gives ' + fmtSig(model, sig) + u +
      (pct === null ? ' (difference not defined: the model value is 0).' : ' (' + fmtPct(pct, sig) + ' difference).');
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const util = { fmtSig, fmtInput, fmtPct, parseNumber, validateNumber, exportName, safePart, localDateISO, verdictFor, predictionMessage, esc };

  /* =================================================================
     BROWSER FRAME
     ================================================================= */
  const FEEDBACK = 'billvanloo.tech+feedback@gmail.com';

  function store(prefix) {
    return {
      get(k, dflt) { try { const s = localStorage.getItem(prefix + k); return s == null ? dflt : JSON.parse(s); } catch (e) { return dflt; } },
      set(k, v) { try { localStorage.setItem(prefix + k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } },
      del(k) { try { localStorage.removeItem(prefix + k); } catch (e) { } },
      clearAll() { try { Object.keys(localStorage).filter(k => k.indexOf(prefix) === 0).forEach(k => localStorage.removeItem(k)); } catch (e) { } },
    };
  }
  function h(tag, attrs, html) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) el.setAttribute(k, attrs[k] === true ? '' : attrs[k]); }
    if (html !== undefined) el.innerHTML = html;
    return el;
  }
  function download(filename, data, type) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = h('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { }
      ta.remove(); return ok;
    }
  }

  function create(cfg) {
    const S = store('ebtn:' + cfg.slug + ':');
    const G = store('ebtn-');                       // shared across tools on one site: name, theme
    const app = {
      cfg, util, PL, SC,
      state: null, el: {},
      settings: Object.assign({ sig: 3, team: '', classPeriod: '', predictFirst: false }, cfg.defaultSettings || {}, S.get('settings', {})),
      pf: { revealed: false, fields: {}, messages: [] },
      invalid: {}, fields: [], log: S.get('log', []),
      sessionStart: Date.now(), working: [],
    };

    /* ---------------- state ---------------- */
    const saved = S.get('state', null);
    app.state = cfg.defaultState();
    if (saved && saved.schemaVersion === cfg.schemaVersion && saved.state) {
      try { app.state = Object.assign(cfg.defaultState(), saved.state); } catch (e) { app.state = cfg.defaultState(); }
    }

    /* ---------------- skeleton ---------------- */
    const repoUrl = 'https://github.com/billvanloo/' + cfg.repo;
    const mail = kind => 'mailto:' + FEEDBACK + '?subject=' + encodeURIComponent('[' + cfg.repo + '] ' + kind);
    document.body.innerHTML = '';
    const header = h('header', { class: 'sh-header' },
      '<div class="titleblock"><span class="t1">' + esc(cfg.tool) + '</span><span class="t2">' + esc(cfg.subtitle || '') + '</span></div>' +
      '<div id="shModes"></div><div class="spacer"></div>' +
      '<div class="namewrap"><label for="shName">Name</label><input id="shName" maxlength="40" placeholder="Your name" autocomplete="name"></div>' +
      '<div class="hbtns">' +
      '<button id="shPredict" aria-pressed="false" title="Hide results until you enter and check a prediction">Predict first</button>' +
      '<button id="shPng" title="Download a PNG of the drawing">Export image</button>' +
      '<button id="shReport" title="Printable report (print to PDF)">Report</button>' +
      '<button id="shSave" title="Save your design as a file">Save</button>' +
      '<button id="shLoad" title="Open a saved design or an import file">Load</button>' +
      '<button id="shLog" title="Your prediction log">Log</button>' +
      '<button id="shSettings" aria-label="Settings" title="Settings">⚙</button>' +
      '<button id="shTheme" aria-pressed="false" title="Switch light or dark theme">theme</button>' +
      '<button id="shHelp" aria-label="Help" title="How to use this tool (?)">?</button>' +
      '</div><input type="file" id="shFile" accept=".json,.csv,application/json,text/csv" hidden>');
    const small = h('div', { id: 'shSmall', class: 'sh-small', role: 'note' },
      '<span>This tool needs a larger screen, at least 1024 px wide, for full use. The readouts still work here.</span><button type="button">Dismiss</button>');
    const main = h('main', { class: 'sh-main' },
      '<section id="shInputs" class="sh-col sh-inputs" aria-label="Inputs"></section>' +
      '<section id="shStage" class="sh-col sh-stage" aria-label="Drawing"></section>' +
      '<section id="shResults" class="sh-col sh-results" aria-label="Results">' +
      '<div id="shResultsBody"></div>' +
      '<div id="shPfBox" class="pfbox" hidden></div>' +
      '<details id="shWorking" class="working"><summary>Show the working</summary><div id="shWorkingBody"></div></details>' +
      '</section>');
    const footer = h('footer', { class: 'sh-footer' },
      '<span class="foot-by">Designed by <a href="https://billvanloo.com" target="_blank" rel="noopener"><strong>Bill Van Loo</strong></a></span>' +
      '<span class="foot-ai">Developed using Claude — please don\'t use this tool if you\'re uncomfortable using tools built with AI assistance.</span>' +
      '<span class="foot-spacer"></span>' +
      '<a href="' + mail('Bug report') + '">Report a bug</a>' +
      '<a href="' + mail('Feature request') + '">Request a feature</a>' +
      '<a href="https://ko-fi.com/billvanloo" target="_blank" rel="noopener">Support on Ko-fi</a>' +
      '<a href="' + repoUrl + '/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>' +
      '<a href="' + repoUrl + '" target="_blank" rel="noopener">View source</a>');
    const live = h('div', { id: 'shLive', class: 'sr-only', role: 'status', 'aria-live': 'polite' });
    const desc = h('div', { id: 'shDesc', class: 'sr-only', 'aria-live': 'polite' });
    const toastEl = h('div', { id: 'shToast', class: 'sh-toast', role: 'status', 'aria-live': 'polite' });
    const report = h('div', { id: 'sh-report' });
    [header, small, main, footer, live, desc, toastEl, report].forEach(e => document.body.appendChild(e));
    const $ = id => document.getElementById(id);
    app.el = { inputs: $('shInputs'), stage: $('shStage'), results: $('shResultsBody'), pf: $('shPfBox'), working: $('shWorkingBody'), workingBox: $('shWorking') };

    /* ---------------- dialogs ---------------- */
    function dialog(id, title) {
      const d = h('dialog', { id, class: 'sh-dlg', 'aria-labelledby': id + 'T' },
        '<div class="dlg-h"><h2 id="' + id + 'T">' + esc(title) + '</h2><button class="btn small" data-close>Close</button></div><div class="dlg-b"></div>');
      d.querySelector('[data-close]').addEventListener('click', () => d.close());
      d.addEventListener('click', e => { if (e.target === d) d.close(); });
      document.body.appendChild(d);
      return { dlg: d, body: d.querySelector('.dlg-b') };
    }
    const helpD = dialog('shHelpDlg', 'How to use the ' + cfg.tool);
    const logD = dialog('shLogDlg', 'Prediction log');
    const setD = dialog('shSettingsDlg', 'Settings');

    /* ---------------- toast, live regions ---------------- */
    let toastT = 0;
    app.toast = (msg, ms) => {
      toastEl.textContent = msg; toastEl.classList.add('on');
      clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms || 3500);
    };
    app.announce = msg => { live.textContent = ''; setTimeout(() => { live.textContent = msg; }, 30); };
    let descT = 0, lastDesc = '';
    app.describe = text => {
      if (text === lastDesc) return;
      lastDesc = text; clearTimeout(descT);
      descT = setTimeout(() => { desc.textContent = text; }, 450);
    };

    /* ---------------- theme ---------------- */
    const curTheme = () => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    function syncTheme() {
      const t = curTheme();
      $('shTheme').textContent = t === 'light' ? '☾ Dark' : '☀ Light';
      $('shTheme').setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
    }
    $('shTheme').addEventListener('click', () => {
      const next = curTheme() === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      G.set('theme', next);
      syncTheme(); render();
    });
    // Palette for drawings, read from the CSS tokens.
    const PAL_KEYS = ['paper', 'grid-minor', 'grid-major', 'ink', 'ink-soft', 'line', 'steel', 'steel-edge', 'dykem', 'dykem-soft', 'brass', 'brass-ink', 'pass', 'fail', 'warn', 'pos-fill', 'neg-fill', 'field', 'panel', 'badge-text'];
    app.pal = () => {
      const cs = getComputedStyle(document.documentElement), p = {};
      PAL_KEYS.forEach(k => { p[k.replace(/-(\w)/g, (m, c) => c.toUpperCase())] = cs.getPropertyValue('--' + k).trim(); });
      p.fontUi = cs.getPropertyValue('--font-ui').trim(); p.fontMono = cs.getPropertyValue('--font-mono').trim();
      return p;
    };
    // Exports and reports are always ink on paper (00 §2).
    app.withLight = fn => {
      const root = document.documentElement, prev = root.getAttribute('data-theme');
      root.setAttribute('data-theme', 'light');
      try { return fn(); } finally { root.setAttribute('data-theme', prev || 'light'); }
    };

    /* ---------------- formatting ---------------- */
    app.fmt = v => fmtSig(v, app.settings.sig);
    app.fmtU = (v, unit) => isNum(v) ? fmtSig(v, app.settings.sig) + (unit ? ' ' + unit : '') : '—';

    /* ---------------- name ---------------- */
    const nameEl = $('shName');
    nameEl.value = G.get('name', '') || '';
    nameEl.addEventListener('input', () => G.set('name', nameEl.value));
    app.student = () => nameEl.value.trim();

    /* ---------------- small screen ---------------- */
    if (G.get('smallDismissed', false)) small.hidden = true;
    small.querySelector('button').addEventListener('click', () => { small.hidden = true; G.set('smallDismissed', true); });

    /* ---------------- modes ---------------- */
    if (cfg.modes) {
      const box = $('shModes');
      box.className = 'modes'; box.setAttribute('role', 'group'); box.setAttribute('aria-label', cfg.modes.label || 'Mode');
      cfg.modes.options.forEach(o => {
        const b = h('button', { type: 'button', 'data-mode': o.id, 'aria-pressed': 'false' }, esc(o.label));
        b.addEventListener('click', () => { cfg.modes.set(app, o.id); app.changed(); });
        box.appendChild(b);
      });
    }
    function syncModes() {
      if (!cfg.modes) return;
      const cur = cfg.modes.get(app);
      document.querySelectorAll('#shModes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === cur ? 'true' : 'false'));
    }

    /* =================================================================
       FIELDS
       ================================================================= */
    // Numeric input row. o: { id, label, unit, name, get(app), set(app, v), min, max, gt, integer,
    // check(v, app), step, help, parent }
    app.numField = (parent, o) => {
      const row = h('div', { class: 'fld' });
      const errId = o.id + 'Err';
      row.innerHTML = '<label for="' + o.id + '">' + o.label + '</label>' +
        '<span class="ctl"><input type="text" inputmode="decimal" id="' + o.id + '" aria-describedby="' + errId + '" autocomplete="off">' +
        (o.unit ? '<span class="unit">' + esc(o.unit) + '</span>' : '') + '</span>' +
        '<div class="err" id="' + errId + '" role="alert"></div>';
      const input = row.querySelector('input'), err = row.querySelector('.err');
      const spec = () => ({ name: o.name || o.label.replace(/<[^>]+>/g, ''), unit: o.unit, min: typeof o.min === 'function' ? o.min(app) : o.min, max: typeof o.max === 'function' ? o.max(app) : o.max, gt: o.gt, integer: o.integer, check: o.check ? v => o.check(v, app) : null });
      function commit() {
        const r = validateNumber(input.value, spec());
        if (r.error) {
          err.textContent = r.error; input.setAttribute('aria-invalid', 'true'); app.invalid[o.id] = r.error;
        } else {
          err.textContent = ''; input.removeAttribute('aria-invalid'); delete app.invalid[o.id];
          o.set(app, r.value);
        }
        app.changed();
      }
      input.addEventListener('input', commit);
      input.addEventListener('keydown', e => {
        if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && o.step) {
          e.preventDefault();
          const cur = parseNumber(input.value);
          const base = isNum(cur) ? cur : o.get(app);
          const d = (e.key === 'ArrowUp' ? 1 : -1) * o.step * (e.shiftKey ? 10 : 1);
          input.value = fmtInput(Number((base + d).toFixed(10)));
          commit();
        }
      });
      const field = {
        o, input, err, row,
        sync() {
          if (document.activeElement === input || app.invalid[o.id]) return;
          const v = o.get(app); const s = fmtInput(v);
          if (input.value !== s && parseNumber(input.value) !== v) input.value = s;
          else if (input.value === '' && s !== '') input.value = s;
        },
        revalidate() { if (input.value !== '') { const r = validateNumber(input.value, spec()); if (r.error && !app.invalid[o.id]) { err.textContent = r.error; input.setAttribute('aria-invalid', 'true'); app.invalid[o.id] = r.error; } else if (!r.error && app.invalid[o.id]) { err.textContent = ''; input.removeAttribute('aria-invalid'); delete app.invalid[o.id]; o.set(app, r.value); } } },
        reset() { err.textContent = ''; input.removeAttribute('aria-invalid'); delete app.invalid[o.id]; input.value = fmtInput(o.get(app)); },
      };
      input.value = fmtInput(o.get(app));
      app.fields.push(field);
      parent.appendChild(row);
      return field;
    };
    // Select row. o: { id, label, options: [[value, label]] or fn(app), get, set }
    app.selectField = (parent, o) => {
      const row = h('div', { class: 'fld' });
      row.innerHTML = '<label for="' + o.id + '">' + o.label + '</label><span class="ctl"><select id="' + o.id + '"></select></span>';
      const sel = row.querySelector('select');
      const fill = () => {
        const opts = typeof o.options === 'function' ? o.options(app) : o.options;
        const html = opts.map(([v, l]) => '<option value="' + esc(v) + '">' + esc(l) + '</option>').join('');
        if (sel.innerHTML !== html) sel.innerHTML = html;
        sel.value = String(o.get(app));
      };
      fill();
      sel.addEventListener('change', () => { o.set(app, sel.value); app.changed(); });
      const field = { o, input: sel, row, sync: fill, reset: fill, revalidate() { } };
      app.fields.push(field);
      parent.appendChild(row);
      return field;
    };
    app.checkField = (parent, o) => {
      const row = h('label', { class: 'chk' }, '<input type="checkbox" id="' + o.id + '"> ' + o.label);
      const cb = row.querySelector('input');
      cb.checked = !!o.get(app);
      cb.addEventListener('change', () => { o.set(app, cb.checked); app.changed(); });
      const field = { o, input: cb, row, sync() { cb.checked = !!o.get(app); }, reset() { cb.checked = !!o.get(app); }, revalidate() { } };
      app.fields.push(field);
      parent.appendChild(row);
      return field;
    };
    app.removeFields = container => { app.fields = app.fields.filter(f => { if (container.contains(f.row)) { delete app.invalid[f.o.id]; return false; } return true; }); };
    app.hasInvalid = () => Object.keys(app.invalid).length > 0;
    app.invalidReason = () => 'not defined: fix the highlighted input' + (Object.keys(app.invalid).length > 1 ? 's' : '');

    /* =================================================================
       PREDICT FIRST (00 §4)
       ================================================================= */
    const pfOn = () => !!app.settings.predictFirst;
    app.masked = () => pfOn() && !app.pf.revealed;
    // Wrap a readout value: shows a blank box while hidden.
    app.show = (text) => app.masked() ? '<span class="masked" aria-label="hidden until you check your prediction">?</span>' : text;
    function clearPrediction() { app.pf.revealed = false; app.pf.fields = {}; app.pf.messages = []; }
    $('shPredict').addEventListener('click', () => {
      app.settings.predictFirst = !pfOn(); saveSettings(); clearPrediction(); render();
      app.announce(pfOn() ? 'Predict first is on. Results are hidden until you check a prediction.' : 'Predict first is off.');
    });
    function problemId() { return cfg.problemId ? cfg.problemId(app) : PL.sandboxProblemId(snapshot().values); }
    function snapshot() { return cfg.inputsSnapshot ? cfg.inputsSnapshot(app) : { values: {}, units: {} }; }
    function renderPf() {
      const box = app.el.pf;
      $('shPredict').setAttribute('aria-pressed', pfOn() ? 'true' : 'false');
      if (!pfOn()) { box.hidden = true; return; }
      box.hidden = false;
      const targets = cfg.predictTargets(app);
      const blocked = app.hasInvalid();
      let html = '<h3>Predict first</h3>';
      if (!app.pf.revealed) {
        html += '<p class="note">Enter your predictions, then press Check. Results stay hidden until you do.</p>';
        targets.forEach(t => {
          const id = 'shPf_' + t.key;
          html += '<div class="pfrow"><label for="' + id + '">' + t.label + '</label><input type="text" inputmode="decimal" id="' + id + '" data-key="' + esc(t.key) + '" value="' + esc(app.pf.fields[t.key] || '') + '" autocomplete="off"><span class="unit">' + esc(t.unit || '') + '</span></div>';
        });
        html += '<div class="btnrow"><button class="btn primary" id="shCheck" type="button"' + (blocked ? ' disabled' : '') + '>Check</button></div>';
        if (blocked) html += '<p class="note warn">Fix the highlighted input before checking.</p>';
      } else {
        app.pf.messages.forEach(m => { html += '<div class="pfmsg ' + (m.verdict || '') + '">' + m.html + '</div>'; });
        html += '<div class="btnrow"><button class="btn" id="shAgain" type="button">Predict again</button></div>';
      }
      box.innerHTML = html;
      box.querySelectorAll('input[data-key]').forEach(inp => inp.addEventListener('input', () => { app.pf.fields[inp.dataset.key] = inp.value; }));
      box.querySelectorAll('input[data-key]').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }));
      const c = $('shCheck'); if (c) c.addEventListener('click', check);
      const a = $('shAgain'); if (a) a.addEventListener('click', () => { clearPrediction(); render(); const f = box.querySelector('input'); if (f) f.focus(); });
    }
    function check() {
      if (app.hasInvalid()) return;
      const targets = cfg.predictTargets(app);
      const student = app.student() || 'unnamed';
      const pid = problemId(), snap = snapshot();
      const msgs = [], recs = [];
      for (const t of targets) {
        const raw = app.pf.fields[t.key];
        if (raw === undefined || String(raw).trim() === '') continue;
        const p = parseNumber(raw);
        if (!isNum(p)) { app.toast(t.label.replace(/<[^>]+>/g, '') + ': enter a number.'); document.getElementById('shPf_' + t.key).focus(); return; }
        const model = isNum(t.model) ? t.model : null;
        const rec = PL.makeRecord({
          tool: cfg.tool, toolVersion: cfg.version, student, team: app.settings.team, classPeriod: app.settings.classPeriod,
          problemId: pid, quantity: t.quantity || t.key, unit: t.unit || '', predicted: p, model, measured: t.measured,
          attempt: PL.nextAttempt(app.log, student, pid, t.quantity || t.key), inputs: snap,
        });
        recs.push(rec);
        const v = verdictFor(rec.pctPredVsModel, cfg.tolerance);
        const tag = v === 'match' ? ' <span class="pftag match">Match</span>' : v === 'close' ? ' <span class="pftag close">Close</span>' : '';

      const opts = o.keepPrediction ? { keepPrediction: true } : undefined;
      if (input.value.trim() === '') { ok(); o.set(app, null); app.changed(opts); return; }
      const r = U.validateNumber(input.value, spec);
      if (r.error) { err.textContent = r.error; input.setAttribute('aria-invalid', 'true'); app.invalid[o.id] = r.error; }
      else { ok(); o.set(app, r.value); }
      app.changed(opts);
    }
    input.addEventListener('input', commit);
    const field = {
      o, input, err, row,
      sync() { if (document.activeElement === input || app.invalid[o.id]) return; const v = U.fmtInput(o.get(app)); if (U.parseNumber(input.value) !== o.get(app)) input.value = v; },
      revalidate() { },
      reset() { ok(); input.value = U.fmtInput(o.get(app)); },
    };
    input.value = U.fmtInput(o.get(app));
    app.fields.push(field); parent.appendChild(row);
    return field;
  }
  const motorList = app => app.settings.motors && app.settings.motors.length ? app.settings.motors : D.DEFAULT_MOTORS;

  /* ------------------------------------------------------------ drawing */
  function draw(app, opts) {
    const p = app.pal(), s = app.state, sol = SOL, masked = app.masked();
    const font = esc(p.fontUi), mono = esc(p.fontMono);
    const W = 700, left = 72, right = 70, top = 58, ph = 310, pw = W - left - right;
    const out = [];
    const txt = (x, y, str, o) => '<text x="' + r1(x) + '" y="' + r1(y) + '" font-family="' + ((o && o.mono) ? mono : font) + '" font-size="' + ((o && o.size) || 12) + '"' +
      ((o && o.weight) ? ' font-weight="' + o.weight + '"' : '') + ' fill="' + ((o && o.fill) || p.ink) + '"' + ((o && o.anchor) ? ' text-anchor="' + o.anchor + '"' : '') +
      ((o && o.rot) ? ' transform="rotate(' + o.rot + ' ' + r1(x) + ' ' + r1(y) + ')"' : '') + '>' + esc(str) + '</text>';
    const line = (x1, y1, x2, y2, stroke, w, dash) => '<line x1="' + r1(x1) + '" y1="' + r1(y1) + '" x2="' + r1(x2) + '" y2="' + r1(y2) + '" stroke="' + stroke + '" stroke-width="' + (w || 1) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
    if (!sol) {
      const H = 120;
      LAYOUT = null;
      return { width: W, height: H, svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"' + (opts && opts.export ? '' : ' id="mdSvg" tabindex="0" role="img" aria-label="Motor plot"') + '><rect width="' + W + '" height="' + H + '" fill="' + p.paper + '"/>' + txt(W / 2, 64, 'Fix the highlighted input to see the motor plot.', { anchor: 'middle', fill: p.fail, weight: 600 }) + '</svg>' };
    }
    const Ts = sol.TsTotal;
    const xMax = 1.05 * Math.max(Ts, ...sol.compare.map(c => c.Ts));
    const yMax = 1.1 * Math.max(s.N0, ...sol.compare.map(c => c.c.N0));
    const pMax = 1.1 * Math.max(sol.Pmax, ...sol.compare.map(c => c.Ts * c.c.N0 * Math.PI / 30 / 4));
    const X = t => left + t / xMax * pw, Y = n => top + (1 - n / yMax) * ph, YP = w => top + (1 - w / pMax) * ph;
    // duty bands (primary motor)
    const b = bands(app);
    [[0, b.continuous, p.pass, 'continuous ≤' + b.continuous + '%'], [b.continuous, b.short, p.brass, 'short use ' + b.continuous + '–' + b.short + '%'], [b.short, 100, p.fail, 'avoid >' + b.short + '%']].forEach(([a, c, col, lab]) => {
      const x1 = X(Ts * a / 100), x2 = X(Ts * c / 100);
      out.push('<rect x="' + r1(x1) + '" y="' + top + '" width="' + r1(x2 - x1) + '" height="' + ph + '" fill="' + col + '" opacity="0.13"/>');
      out.push(txt((x1 + x2) / 2, top + ph - 8, lab, { anchor: 'middle', size: 11.5, fill: p.ink }));
    });
    // Legend row (keeps line labels off the plot).
    const leg = [[s.label, null, p.ink, 2.8]].concat(sol.compare.map((c, i) => [c.c.label, DASH[i], p.ink, 2])).concat([['power', '6 5', p.dykem, 2]]);
    let lx = left;
    leg.forEach(([lab, dash, col, w]) => {
      const t = lab.length > 34 ? lab.slice(0, 32) + '…' : lab;
      out.push(line(lx, 17, lx + 26, 17, col, w, dash) + txt(lx + 31, 21, t, { size: 11.5, fill: col === p.dykem ? p.dykem : p.ink }));
      lx += 40 + t.length * 6.3;
    });
    out.push(txt(left, top - 10, 'Duty bands after ISL Products guidance', { size: 11, fill: p.inkSoft }));
    // axes and grid
    const xs = niceStep(xMax), ys = niceStep(yMax), ps = niceStep(pMax);
    for (let v = 0; v <= xMax + 1e-12; v += xs) { out.push(line(X(v), top + ph, X(v), top + ph + 5, p.ink)); out.push(txt(X(v), top + ph + 19, app.fmt(v), { anchor: 'middle', size: 11, fill: p.inkSoft })); }
    for (let v = 0; v <= yMax + 1e-12; v += ys) { out.push(line(left - 5, Y(v), left, Y(v), p.ink)); out.push(txt(left - 8, Y(v) + 4, app.fmt(v), { anchor: 'end', size: 11, fill: p.inkSoft })); }
    for (let v = 0; v <= pMax + 1e-12; v += ps) { out.push(line(left + pw, YP(v), left + pw + 5, YP(v), p.dykem)); out.push(txt(left + pw + 8, YP(v) + 4, app.fmt(v), { size: 11, fill: p.dykem })); }
    out.push('<rect x="' + left + '" y="' + top + '" width="' + pw + '" height="' + ph + '" fill="none" stroke="' + p.ink + '" stroke-width="1.2"/>');
    out.push(txt(left + pw / 2, top + ph + 40, 'Motor torque (N·m)', { anchor: 'middle', size: 12.5 }));
    out.push(txt(18, top + ph / 2, 'Motor speed (rpm)', { anchor: 'middle', size: 12.5, rot: -90 }));
    out.push(txt(W - 12, top + ph / 2, 'Mechanical power (W)', { anchor: 'middle', size: 12.5, rot: 90, fill: p.dykem }));
    // power curve (dashed) and motor line
    const pc = [];
    for (let k = 0; k <= 60; k++) { const T = Ts * k / 60, w = sol.op.motor.w0 * (1 - T / Ts); pc.push(r1(X(T)) + ',' + r1(YP(T * w))); }
    out.push('<polyline points="' + pc.join(' ') + '" fill="none" stroke="' + p.dykem + '" stroke-width="2" stroke-dasharray="6 5"/>');
    out.push(txt(X(Ts / 2), YP(sol.Pmax) - 8, 'peak power ' + app.fmt(sol.Pmax) + ' W at ' + app.fmt(sol.TatPmax) + ' N·m, ' + app.fmt(sol.NatPmax) + ' rpm', { anchor: 'middle', size: 11.5, fill: p.dykem }));
    out.push(line(X(0), Y(s.N0), X(Ts), Y(0), p.ink, 2.8));
    // compare motors
    sol.compare.forEach((c, i) => {
      out.push(line(X(0), Y(c.c.N0), X(c.Ts), Y(0), p.ink, 2, DASH[i]));
      if (!masked && !c.op.stalled) out.push('<circle cx="' + r1(X(c.op.Tm)) + '" cy="' + r1(Y(c.Nm)) + '" r="5" fill="' + p.paper + '" stroke="' + p.ink + '" stroke-width="2"/>');
    });
    // operating point
    const op = sol.op;
    if (!masked) {
      if (op.stalled) {
        out.push('<circle cx="' + r1(X(Math.min(op.Tm, xMax))) + '" cy="' + r1(Y(0)) + '" r="7" fill="' + p.fail + '"/>');
        out.push(txt(X(Math.min(op.Tm, xMax)) - 10, Y(0) - 12, 'STALLED: needs ' + app.fmt(op.Tm) + ' N·m', { anchor: 'end', weight: 700, fill: p.fail }));
      } else {
        const ox = X(op.Tm), oy = Y(sol.Nm);
        out.push(line(ox, oy, ox, top + ph, p.fail, 1, '2 3') + line(left, oy, ox, oy, p.fail, 1, '2 3'));
        out.push('<circle cx="' + r1(ox) + '" cy="' + r1(oy) + '" r="7" fill="' + p.fail + '" stroke="' + p.paper + '" stroke-width="1.5"/>');
        const end = ox > left + pw * 0.6;
        out.push(txt(ox + (end ? -12 : 12), oy - 10, 'operating point: ' + app.fmt(op.Tm) + ' N·m, ' + app.fmt(sol.Nm) + ' rpm', { weight: 700, fill: p.fail, anchor: end ? 'end' : 'start' }));
      }
    }
    // drag surface
    out.push('<rect class="plotarea" x="' + left + '" y="' + top + '" width="' + pw + '" height="' + ph + '" fill="transparent"/>');
    let y = top + ph + 52;
    // electrical panel
    if (sol.elec && s.electrical) {
      const t2 = y + 26, h2 = 150, Imax = 1.1 * (s.k * s.I0 + (s.Is - s.I0) * xMax / sol.Ts);
      const YI = i => t2 + (1 - i / Imax) * h2, YE = e => t2 + (1 - e / 100) * h2;
      out.push(txt(12, y + 14, 'Current and motor efficiency (extension)', { weight: 700, size: 13 }));
      out.push('<rect x="' + left + '" y="' + t2 + '" width="' + pw + '" height="' + h2 + '" fill="none" stroke="' + p.ink + '" stroke-width="1.2"/>');
      const Ipts = [], Epts = [];
      for (let k = 0; k <= 60; k++) {
        const T = xMax * k / 60, I = s.k * s.I0 + (s.Is - s.I0) * T / sol.Ts;
        Ipts.push(r1(X(T)) + ',' + r1(YI(I)));
        if (T <= Ts) { const w = sol.op.motor.w0 * (1 - T / Ts); Epts.push(r1(X(T)) + ',' + r1(YE(100 * T * w / (s.V * I)))); }
      }
      out.push('<polyline points="' + Ipts.join(' ') + '" fill="none" stroke="' + p.brassInk + '" stroke-width="2.2"/>');
      out.push('<polyline points="' + Epts.join(' ') + '" fill="none" stroke="' + p.pass + '" stroke-width="2.2" stroke-dasharray="7 4"/>');
      const is = niceStep(Imax, 4);
      for (let v = 0; v <= Imax + 1e-12; v += is) out.push(txt(left - 8, YI(v) + 4, app.fmt(v), { anchor: 'end', size: 11, fill: p.brassInk }));
      for (let v = 0; v <= 100; v += 25) out.push(txt(left + pw + 8, YE(v) + 4, v + '%', { size: 11, fill: p.pass }));
      out.push(txt(18, t2 + h2 / 2, 'Current (A)', { anchor: 'middle', size: 12, rot: -90, fill: p.brassInk }));
      out.push(txt(W - 12, t2 + h2 / 2, 'Efficiency', { anchor: 'middle', size: 12, rot: 90, fill: p.pass }));
      out.push(txt(left + 6, t2 + 14, 'current (solid)', { size: 11, fill: p.brassInk }) + txt(left + 6, t2 + 28, 'efficiency (dashed)', { size: 11, fill: p.pass }));
      if (!masked && !op.stalled) {
        out.push('<circle cx="' + r1(X(op.Tm)) + '" cy="' + r1(YI(sol.elec.I)) + '" r="5" fill="' + p.brassInk + '"/>');
        if (sol.elec.eff !== null) out.push('<circle cx="' + r1(X(op.Tm)) + '" cy="' + r1(YE(sol.elec.eff * 100)) + '" r="5" fill="' + p.pass + '"/>');
      }
      y = t2 + h2 + 12;

    // pull force against gear ratio (spec 02a §5)
    if (sol.pull && s.pull) {
      const pu = sol.pull, t3 = y + 26, h3 = 170, iNow = sol.g.i;
      const iMax = 2 * Math.max(iNow, pu.traction ? pu.iStar : 0);
      const fMax = 1.15 * Math.max(pu.Fmotor, pu.traction ? pu.Ftraction : 0, 1e-9);
      const XI = i => left + i / iMax * pw, YF = F => t3 + (1 - F / fMax) * h3;
      out.push(txt(12, y + 14, 'Pull test: pulling force against gear ratio', { weight: 700, size: 13 }));
      out.push('<rect x="' + left + '" y="' + t3 + '" width="' + pw + '" height="' + h3 + '" fill="none" stroke="' + p.ink + '" stroke-width="1.2"/>');
      const is = niceStep(iMax), fs = niceStep(fMax, 4);
      for (let v = 0; v <= iMax + 1e-12; v += is) { out.push(line(XI(v), t3 + h3, XI(v), t3 + h3 + 5, p.ink)); out.push(txt(XI(v), t3 + h3 + 19, app.fmt(v), { anchor: 'middle', size: 11, fill: p.inkSoft })); }
      for (let v = 0; v <= fMax + 1e-12; v += fs) { out.push(line(left - 5, YF(v), left, YF(v), p.ink)); out.push(txt(left - 8, YF(v) + 4, app.fmt(v), { anchor: 'end', size: 11, fill: p.inkSoft })); }
      out.push(txt(left + pw / 2, t3 + h3 + 38, 'Gear ratio i (extra reduction)', { anchor: 'middle', size: 12.5 }));
      out.push(txt(18, t3 + h3 / 2, 'Pull (N)', { anchor: 'middle', size: 12.5, rot: -90 }));
      // motor line, clipped at the top of the panel
      const iTop = Math.min(iMax, fMax / pu.slope);
      out.push(line(XI(0), YF(0), XI(iTop), YF(pu.slope * iTop), p.ink, 2, '7 4'));
      const iLab = iTop * (pu.traction ? Math.min(0.85, Math.max(0.55, 1.3 * pu.iStar / iTop)) : 0.6);
      out.push(txt(XI(iLab) - 8, YF(pu.slope * iLab) - 4, 'motors stall', { anchor: 'end', size: 11.5 }));
      if (pu.traction) {
        out.push(line(XI(0), YF(pu.Ftraction), XI(iMax), YF(pu.Ftraction), p.brassInk, 2, '2 3'));
        out.push(txt(left + pw - 6, YF(pu.Ftraction) + 16, 'wheels slip: ' + app.fmt(pu.Ftraction) + ' N', { anchor: 'end', size: 11.5, fill: p.brassInk }));
        // predicted pull: the lower of the two (bold)

        if (!masked) {
          out.push(line(XI(pu.iStar), YF(pu.Ftraction), XI(pu.iStar), t3 + h3, p.inkSoft, 1, '2 3'));
          out.push(txt(XI(pu.iStar) + 6, t3 + h3 - 6, 'i* = ' + app.fmt(pu.iStar), { size: 11.5, fill: p.inkSoft }));

      if (!masked) {
        out.push('<circle cx="' + r1(XI(iNow)) + '" cy="' + r1(YF(pu.F)) + '" r="7" fill="' + p.fail + '" stroke="' + p.paper + '" stroke-width="1.5"/>');
        const end = XI(iNow) > left + pw * 0.6;
        out.push(txt(XI(iNow) + (end ? -12 : 12), YF(pu.F) - 10, 'your design: ' + app.fmt(pu.F) + ' N at i = ' + app.fmt(iNow), { weight: 700, fill: p.fail, anchor: end ? 'end' : 'start' }));
      }

    const H = Math.ceil(y);

    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"' +
      (opts && opts.export ? '' : ' id="mdSvg" tabindex="0" role="application" aria-roledescription="motor plot" aria-label="Motor torque-speed plot. Left and right arrow keys change the load torque; hold Shift for bigger steps." aria-describedby="shDesc"') +
      '><rect width="' + W + '" height="' + H + '" fill="' + p.paper + '"/>' + out.join('') + '</svg>';
    return { svg, width: W, height: H };
  }

  /* ------------------------------------------------------------ plot interaction */
  function plotTorque(e) {
    const svg = $('mdSvg'); if (!svg || !LAYOUT) return null;
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX - r.left) * LAYOUT.W / r.width;
    return Math.max(0, Math.min(LAYOUT.xMax, (sx - LAYOUT.left) / LAYOUT.pw * LAYOUT.xMax));
  }
  function setFromMotorTorque(app, Tm) {
    const g = SOL.g;
    D.setLoadTorque(app.state, Tm * g.i * g.eta);
    app.refreshFields(); app.changed();
  }
  function wirePlot(app) {
    const card = $('mdDraw');
    card.addEventListener('pointerdown', e => {
      if (!SOL || !e.target.closest('.plotarea')) return;
      e.preventDefault(); ui.drag = true; card.setPointerCapture(e.pointerId);
      const t = plotTorque(e); if (t !== null) setFromMotorTorque(app, t);
    });
    card.addEventListener('pointermove', e => { if (!ui.drag || !SOL) return; const t = plotTorque(e); if (t !== null) setFromMotorTorque(app, t); });
    const end = e => { if (ui.drag) { ui.drag = false; try { card.releasePointerCapture(e.pointerId); } catch (x) { } } };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
    card.addEventListener('keydown', e => {
      if (e.target.id !== 'mdSvg' || !SOL) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const step = SOL.TsTotal * (e.shiftKey ? 0.1 : 0.01) * (e.key === 'ArrowRight' ? 1 : -1);
        setFromMotorTorque(app, Math.max(0, SOL.op.Tm + step));
        const f = $('mdSvg'); if (f) f.focus({ preventScroll: true });
        app.announce('Load torque ' + app.fmtU(SOL.TL, 'N·m') + ' at the output.');
      }
    });
  }

  /* ------------------------------------------------------------ dynamic lists */
  function buildStages(app) {
    const box = $('mdStages'); app.removeFields(box); box.innerHTML = '';
    app.state.stages.forEach((st, n) => {
      const card = document.createElement('div'); card.className = 'itemcard stcard';
      card.innerHTML = '<div class="ih">Stage ' + (n + 1) + (app.state.stages.length > 1 ? '<button class="btn small danger rm" type="button" aria-label="Remove stage ' + (n + 1) + '">✕</button>' : '') + '</div>';
      box.appendChild(card);
      const rm = card.querySelector('.rm');
      if (rm) rm.addEventListener('click', () => { app.state.stages = app.state.stages.filter(x => x.id !== st.id); buildStages(app); app.changed(); });
      app.numField(card, Object.assign({ id: 'mdR' + st.id, label: 'Ratio', step: 0.01, get: () => st.ratio, set: (a, v) => { st.ratio = v; } }, D.FIELDS.ratio));
      app.numField(card, Object.assign({ id: 'mdE' + st.id, label: 'Efficiency', step: 0.01, get: () => st.efficiency, set: (a, v) => { st.efficiency = v; } }, D.FIELDS.eff));
    });
    $('mdAddSt').disabled = app.state.stages.length >= D.MAX_STAGES;
  }
  function buildCompare(app) {
    const box = $('mdCmp'); app.removeFields(box); box.innerHTML = '';
    app.state.compare.forEach((c, n) => {
      const card = document.createElement('div'); card.className = 'itemcard cmpcard';
      card.innerHTML = '<div class="ih"><input type="text" maxlength="30" aria-label="Motor name" value="' + esc(c.label) + '"> <span class="note">' + (n === 0 ? 'dashed' : 'dotted') + '</span><button class="btn small danger rm" type="button" aria-label="Remove ' + esc(c.label) + '">✕</button></div>';
      box.appendChild(card);
      card.querySelector('input').addEventListener('input', e => { c.label = e.target.value || 'Motor'; app.changed({ keepPrediction: true }); });
      card.querySelector('.rm').addEventListener('click', () => { app.state.compare = app.state.compare.filter(x => x.id !== c.id); buildCompare(app); app.changed(); });
      app.numField(card, { id: 'mdCT' + c.id, label: 'Stall torque', name: 'Stall torque', unit: app.state.TsUnit, gt: 0, step: 0.1, check: v => D.tsCheck(v, app.state.TsUnit), get: () => c.Ts, set: (a, v) => { c.Ts = v; } });
      app.numField(card, Object.assign({ id: 'mdCN' + c.id, label: 'No-load speed', step: 10, get: () => c.N0, set: (a, v) => { c.N0 = v; } }, D.FIELDS.N0));
    });
    $('mdAddCmp').disabled = app.state.compare.length >= D.MAX_COMPARE;
  }

  /* ------------------------------------------------------------ results */
  function results(app) {
    const s = app.state, sol = SOL, sh = app.show, fu = app.fmtU;
    if (!sol) { app.el.results.innerHTML = '<div class="sec-h">Results</div><p class="reason">' + esc(app.invalidReason()) + '.</p>'; return; }
    const op = sol.op, rows = [];
    const row = (k, v, cls) => rows.push('<tr' + (cls ? ' class="' + cls + '"' : '') + '><th>' + k + '</th><td>' + v + '</td></tr>');
    const bandCls = { continuous: 'pass', short: 'info', avoid: 'fail', stalled: 'fail' }[op.band];
    row('Motor torque', sh(esc(fu(op.Tm, 'N·m')) + ' (' + esc((app.fmt(op.pct) + '%')) + ')'));
    row('Motor speed', sh(esc(fu(sol.Nm, 'rpm'))));
    row('Output speed', sh(esc(fu(sol.Nout, 'rpm'))));
    if (sol.v !== undefined && sol.v !== null) row(s.loadType === 'lift' ? 'Lift speed' : 'Rim speed', sh(esc(fu(sol.v, 'm/s'))));
    row('Output power / peak', sh(esc(fu(op.Pout, 'W'))) + ' / ' + esc(fu(sol.Pmax, 'W')));
    row('Duty range', sh('<span class="verdict ' + bandCls + '">' + esc(D.BAND_TEXT[op.band]) + '</span>'));
    let html = '<div class="sec-h">Results</div><table class="ro">' + rows.join('') + '</table>';
    if (op.stalled && !app.masked()) html += '<p class="note warn">Stalled: the load needs ' + esc(fu(op.Tm, 'N·m')) + ' at the motor, more than its ' + esc(fu(sol.TsTotal, 'N·m')) + ' stall torque. Use more reduction, a stronger motor or more motors.</p>';
    if (s.useTarget && sol.solver) {
      const sv = sol.solver, r2 = [];
      const row2 = (k, v) => r2.push('<tr><th>' + k + '</th><td class="wrap">' + v + '</td></tr>');
      if (!sv.feasible) {
        html += '<div class="sec-h">Ratio solver (target ' + esc(fu(s.Ntarget, 'rpm')) + ')</div>' + (app.masked() ? '<table class="ro"><tr><th>Recommended i</th><td>' + sh('') + '</td></tr></table>' : '<p class="note warn">This motor cannot deliver that speed at that load. It would need more power than it can make. Try a stronger motor or more motors.</p>');
      } else {
        row2('Recommended i', sh(esc(app.fmt(sv.iHigh))));
        if (sv.iLow) row2('Other root', sh(esc(app.fmt(sv.iLow)) + ' <span class="reason">(' + esc((app.fmt(sv.pctLow) + '%')) + ' of stall) possible but the motor would work above half its stall torque</span>'));
        const rr = sol.rounded;
        row2('Rounded (' + esc(rr.text) + ')', sh(esc(app.fmt(rr.ratio)) + ' → ' + esc(fu(rr.Nout, 'rpm')) + ', error ' + esc((rr.err >= 0 ? '+' : '') + app.fmt(rr.err)) + '%'));
        html += '<div class="sec-h">Ratio solver (target ' + esc(fu(s.Ntarget, 'rpm')) + ')</div><table class="ro">' + r2.join('') + '</table>' +
          '<div class="btnrow"><button class="btn" id="mdUse" type="button"' + (app.masked() ? ' disabled' : '') + '>Use this ratio' + (app.masked() ? '' : ' (' + esc(app.fmt(rr.ratio)) + ')') + '</button></div>';
      }
    }

        [{ label: s.label + ' (solid)', op, Nout: sol.Nout }].concat(sol.compare.map((c, i) => ({ label: c.c.label + (i === 0 ? ' (dashed)' : ' (dotted)'), op: c.op, Nout: c.Nout })))

  // Is the measured pull on the student's latest pull prediction for this design?
  // Same problem ID the shell uses for sandbox records.
  function pullLogged(app) {
    const pid = PredictionLog.sandboxProblemId(D.snapshot(app.state).values), who = app.student() || 'unnamed';
    for (let i = app.log.length - 1; i >= 0; i--) {
      const r = app.log[i];
      if (r.student === who && r.problemId === pid && r.quantity === D.PULL_QUANTITY) return r.measured === app.state.Fmeas;
    }
    return false;
  }

  // VEXcode V5 Python project that holds both drive motors, for measuring μ. Same bytes as

  const HOLD_PROGRAM = "{\"mode\":\"Text\",\"hardwareTarget\":\"brain\",\"textContent\":\"#region VEXcode Generated Robot Configuration\\nfrom vex import *\\nimport urandom\\nimport math\\n\\n# Brain should be defined by default\\nbrain=Brain()\\n\\n# Robot configuration code\\nleft_drive_smart = Motor(Ports.PORT1, GearSetting.RATIO_18_1, False)\\nright_drive_smart = Motor(Ports.PORT2, GearSetting.RATIO_18_1, True)\\ndrivetrain = DriveTrain(left_drive_smart, right_drive_smart, 319.19, 295, 40, MM, 1)\\n\\n\\n# wait for rotation sensor to fully initialize\\nwait(30, MSEC)\\n\\n\\n# Make random actually random\\ndef initializeRandomSeed():\\n    wait(100, MSEC)\\n    random = brain.battery.voltage(MV) + brain.battery.current(CurrentUnits.AMP) * 100 + brain.timer.system_high_res()\\n    urandom.seed(int(random))\\n      \\n# Set random seed \\ninitializeRandomSeed()\\n\\n\\ndef play_vexcode_sound(sound_name):\\n    # Helper to make playing sounds from the V5 in VEXcode easier and\\n    # keeps the code cleaner by making it clear what is happening.\\n    print(\\\"VEXPlaySound:\\\" + sound_name)\\n    wait(5, MSEC)\\n\\n# add a small delay to make sure we don't print in the middle of the REPL header\\nwait(200, MSEC)\\n# clear the console to make sure we don't have the REPL in the console\\nprint(\\\"\\\\033[2J\\\")\\n\\n#endregion VEXcode Generated Robot Configuration\\n\\n# ------------------------------------------\\n# \\n# \\tProject:      VEXcode Project\\n#\\tAuthor:       PLTW Engineering\\n#\\tCreated:      2023\\n#\\tDescription:  Tug-of-War Example Code\\n# \\n# ------------------------------------------\\n\\n# Library imports\\nfrom vex import *\\n\\n# Begin project code\\n# Set hold once: each stop() locks the wheels where they are at that moment,\\n# so stopping again in a loop would let them creep under the pull.\\ndrivetrain.set_stopping(HOLD)\\ndrivetrain.stop()\\nbrain.screen.print(\\\"HOLD ENGAGED\\\")\\n\\n# Keep the program running so the motors keep holding.\\nwhile True:\\n    wait(20, MSEC)\\n\\n\",\"textLanguage\":\"python\",\"robotConfig\":[{\"port\":[1,2,null],\"name\":\"drivetrain\",\"customName\":false,\"deviceType\":\"Drivetrain\",\"deviceClass\":\"smartdrive\",\"setting\":{\"type\":\"2-motor\",\"wheelSize\":\"wheel4in\",\"gear\":\"ratio18_1\",\"gearRatio\":\"1:1\",\"direction\":\"fwd\",\"gyroType\":\"none\",\"width\":\"295\",\"unit\":\"mm\",\"wheelbase\":\"40\",\"wheelbaseUnit\":\"mm\",\"xOffset\":\"0\",\"xOffsetUnit\":\"mm\",\"yOffset\":\"0\",\"yOffsetUnit\":\"mm\",\"thetaOffset\":\"180\"},\"triportSourcePort\":null}],\"slot\":1,\"platform\":\"V5\",\"sdkVersion\":\"20240802.15.00.00\",\"appVersion\":\"4.68.0\",\"minVersion\":\"4.60.0\",\"fileFormat\":\"2.0.0\",\"targetBrainGen\":\"First\",\"v5Sounds\":[{\"name\":\"game over\",\"url\":\"static/sounds/mixkit-arcade-retro-game-over-213.wav\"}],\"v5SoundsEnabled\":false,\"aiVisionSettings\":{\"colors\":[],\"codes\":[],\"tags\":true,\"AIObjects\":true,\"AIObjectModel\":[],\"aiModelDropDownValue\":null},\"target\":\"Physical\"}";
  const holdLink = '<a download="HOLD_VEXcode_Project.v5python" href="data:application/octet-stream;charset=utf-8,' + encodeURIComponent(HOLD_PROGRAM) + '">Download the HOLD program</a>';
  const HELP = {
    html: '<p>Describe a DC motor by two numbers from its datasheet, the <strong>stall torque</strong> and the <strong>no-load speed</strong>. Add gearing and a load, and the tool shows where the motor actually runs. It can also solve for the gear ratio that hits a target output speed under that load.</p>' +
      '<h3>Why the no-load speed gives the wrong ratio</h3><p>Say you want the output to turn at 95.5 rpm and the motor\'s no-load speed is 300 rpm. Dividing gives a ratio of 300 ÷ 95.5 = 3.14. But the load (0.68 N·m through 90% efficient gearing) makes the motor slow down along its torque-speed line to about 264 rpm. Through a 3.14 ratio the output turns at only 84.0 rpm, 12% slow (test cases MD-1 and MD-2). The ratio solver uses the <em>loaded</em> speed instead and gives 2.70, which delivers 95.5 rpm with the motor at about 14% of its stall torque.</p>' +
      '<h3>The model</h3><ol>' +
      '<li>Motor torque falls in a straight line with speed: T = T<sub>s</sub>(1 − N/N<sub>0</sub>). Two identical motors on one gearbox double the stall torque at the same no-load speed.</li>' +
      '<li>Mechanical power P = Tω is zero at stall and at no load, and peaks at half the stall torque and half the no-load speed: P<sub>max</sub> = T<sub>s</sub>ω<sub>0</sub>/4.</li>' +
      '<li>The gearing multiplies ratios and efficiencies. The motor must supply T<sub>m</sub> = T<sub>L</sub>/(iη), and it then runs at N<sub>m</sub> = N<sub>0</sub>(1 − T<sub>m</sub>/T<sub>s</sub>), giving N<sub>out</sub> = N<sub>m</sub>/i. If T<sub>m</sub> reaches T<sub>s</sub> the motor stalls.</li>' +
      '<li>For a target speed, the ratio satisfies N<sub>out</sub>i² − N<sub>0</sub>i + N<sub>0</sub>T<sub>L</sub>/(ηT<sub>s</sub>) = 0. The larger root keeps the motor below half its stall torque. If there is no real root, the motor cannot make that much power.</li>' +
      '<li>The efficiency η is treated as constant, whatever the load. Real gearboxes are less efficient at light loads.</li></ol>' +
      '<p><strong>Duty range.</strong> One gear motor maker\'s guidance: up to 30% of stall torque for continuous duty, 30% to 60% for short periods only, and above 60% avoid. Your teacher can change these edges in Settings.</p>' +
      '<p><strong>Load types.</strong> Enter a torque directly, a force at a radius (T = F r, for a pulley or wheel), or a mass lifted on a spool (T = m g r, with g = 9.81 m/s²).</p>' +
      '<p><strong>Current and efficiency (extension).</strong> With the supply voltage, no-load current and stall current, current rises in a straight line with torque, I = I<sub>0</sub> + (I<sub>s</sub> − I<sub>0</sub>)T<sub>m</sub>/T<sub>s</sub>. Motor efficiency is P<sub>mech</sub>/(V I).</p>' +
      '<h3>VEX pull test</h3><p>Turn on <strong>Pull test</strong> to predict how hard a VEX vehicle can pull on a fixed force sensor. A pull is limited two ways. The motors stall when F<sub>motor</sub> = k T<sub>s</sub> i η / r, with r the wheel radius. The wheels slip when F<sub>traction</sub> = μ f m g, with m the vehicle mass, f the share of its weight on the driven wheels and μ the coefficient of friction between the tires and the floor. The vehicle pulls with whichever is smaller. Above the crossover ratio i*, more gearing adds no pull; only more weight on the driven wheels or grippier tires will. Enter only your extra gearing: the motor\'s cartridge is already part of its stall torque.</p>' +
      '<p><strong>Why 150 rpm does not matter here.</strong> The program asks each motor for 150 rpm. A tethered vehicle cannot move, so the motor\'s controller pushes as hard as it can, up to its 2.5 A current limit, and the motor gives its full stall torque. The speed setting changes how fast the vehicle drives, not how hard it can pull when held still.</p>' +
      '<p><strong>Measuring μ.</strong> Set both motors\' stopping mode to <strong>hold</strong> (not brake) and stop them, with the program still running. ' + holdLink + ' (VEXcode V5, Python; drive motors in ports 1 and 2) does this. Hold actively drives each motor back to its position, so the wheels stay locked; brake only resists turning, so the wheels can creep and the reading comes out low. Weigh the vehicle. Pull it straight back, level, with the force sensor at axle height, until it slides, and record the peak force. Watch the wheels: they must slide without turning. If they turn, the motors gave way before the tires did, and the reading is not μ. If every wheel is locked, μ = F<sub>slide</sub> / (m g). If only the driven wheels are locked and the others roll, μ = F<sub>slide</sub> / (f m g). Omni wheels grip through their rollers, so measure each wheel type you consider.</p>' +
      '<p><strong>Things that lower a measured pull.</strong> A torque limit set in the program (Motor.setTorqueLimit) caps the torque. A hot motor is cut back to 50%, then 25%, 12.5% and 0% of its current, so let motors cool between trials and record the peak in the first few seconds. Battery charge does not matter: the V5 motor holds its power within 1%.</p>' +
      '<p><strong>Saving your measurement.</strong> With Predict first on, check a pull prediction, then test the vehicle and type the sensor\'s peak force into Measured pull. It is saved in the prediction log with that prediction, as long as the design has not changed. You can also enter it before you check. The log\'s Measured column and its export show the reading and its percent difference from the model.</p>' +
      '<p><strong>Working with other tools.</strong> <strong>Load</strong> opens a drive-request file from the Gear Train Workbench or the Conveyor Designer. <strong>Export drive result</strong> saves the chosen ratio, operating point and duty range for them to read.</p>',
    units: 'Stall torque can be entered in N·m, N·cm, oz·in or kg·cm, the units on many hobby motor datasheets (1 ozf = 0.27801385 N, 1 kgf = 9.80665 N). Switching the unit converts the value. The plot always uses N·m. Speeds are in rpm, and rpm × 2π/60 gives rad/s.',
    keys: [['Tab to the plot', 'Then use the keys below'], ['← / →', 'Change the load torque by 1% of stall (Shift: 10%)']],
    teacher: '<p>The motor list starts with one clearly labeled <strong>Example motor (not a real product)</strong>, with a 2 N·m stall torque and 300 rpm no-load speed. Add your class motors in Settings as JSON, for example <code>[{"label": "Kit motor A", "stallTorque": 0.35, "noLoadSpeed": 150}]</code>, with the torque in N·m and the speed in rpm. The list is kept in this browser. To share it, copy the JSON from Settings and have students paste it into theirs.</p>' +
      '<p>Stage efficiency starts at 0.90, an example value; have students measure their own. The duty band edges (30% and 60%) come from one manufacturer\'s guidance and can be changed in Settings.</p>' +
      '<p>Version 1 models a permanent-magnet brushed DC motor at constant voltage. PWM speed control, heating, acceleration time and brushless motors are not modeled.</p>' +
      '<p><strong>VEX pull test.</strong> The V5 Smart Motor (11W) presets use VEX\'s 2.1 N·m stall torque for the red 36:1 cartridge, scaled by the cartridge ratio: 1.05 N·m for green 18:1 and 0.35 N·m for blue 6:1. They are always in the motor list, alongside your own motors. The wheel presets are the 2.75" and 4" traction wheels and the 200 mm travel omni wheel (64 mm diameter); students can type a measured radius instead. The model leaves out weight shifting when the tow point is above the axle, and rolling resistance.</p>' +
      '<p>Predict first hides the output speed, the motor torque as a percent of stall, the recommended ratio and, with the pull test on, the pulling force, along with the operating point dot and everything that gives them away.</p>',
    sources: [
      { title: 'MIT D.C. motor torque/speed tutorial', url: 'http://lancet.mit.edu/motors/motors3.html' },
      { title: 'MIT D.C. motor tutorial, power curve page', url: 'http://lancet.mit.edu/motors/motors4.html' },
      { title: 'Motion Control Tips, torque equation and DC motors', url: 'https://www.motioncontroltips.com/torque-equation/' },
      { title: 'Faulhaber, DC motor calculations', url: 'https://www.faulhaber.com/en/know-how/tutorials/dc-motor-tutorial-motor-calculations-for-coreless-brush-dc-motors/' },
      { title: 'ISL Products, reading DC gear motor performance curves', url: 'https://islproducts.com/design-note/how-to-read-dc-motor-gear-motor-performance-curves/' },
      { title: 'OpenStax University Physics Vol. 1, 10.8 Work and power for rotational motion', url: 'https://openstax.org/books/university-physics-volume-1/pages/10-8-work-and-power-for-rotational-motion' },
      { title: 'VEX Library, Understanding V5 Smart Motor (11W) Performance', url: 'https://kb.vex.com/hc/en-us/articles/360044325872-Understanding-V5-Smart-Motor-11W-Performance' },
      { title: 'OpenStax College Physics 2e, 5.1 Friction', url: 'https://openstax.org/books/college-physics-2e/pages/5-1-friction' },

    },
    afterLoad(app) {

        '<div class="fld"><label for="mdBS">Short periods up to</label><span class="ctl"><input type="text" id="mdBS" inputmode="decimal"><span class="unit">%</span></span></div><p class="note" id="mdBMsg"></p>' +
        '<h3>Motor list</h3><p class="note">A JSON list of motors: label, stallTorque in N·m, noLoadSpeed in rpm.</p><textarea id="mdML" rows="6"></textarea>' +
        '<div class="btnrow"><button class="btn" id="mdMLSave" type="button">Save motor list</button><button class="btn" id="mdMLReset" type="button">Reset to the example motor</button></div><p class="note" id="mdMLMsg"></p>';
      $('mdBC').value = app.settings.bandCont; $('mdBS').value = app.settings.bandShort;
      const bandsIn = () => {
        const c = U.parseNumber($('mdBC').value), sh = U.parseNumber($('mdBS').value);

        $('mdBMsg').textContent = 'Saved.'; $('mdBMsg').className = 'note';

      };
      $('mdBC').addEventListener('input', bandsIn); $('mdBS').addEventListener('input', bandsIn);
      $('mdML').value = JSON.stringify(motorList(app), null, 2);
      $('mdMLSave').addEventListener('click', () => {

    build(app) {

      const mo = sec('<div class="sec-h">Motor</div>');
      app.selectField(mo, {
        id: 'mdPre', label: 'Preset', options: a => motorList(a).map((m, i) => ['m' + i, m.label]).concat(D.VEX_MOTORS.map(m => [m.id, m.label]), [['custom', 'Custom (my motor)']]),
        get: a => a.state.preset === 'custom' ? 'custom' : (a.state.preset === 'example' ? 'm0' : a.state.preset),

      $('mdAddSt').addEventListener('click', () => { const s = app.state; if (s.stages.length >= D.MAX_STAGES) return; s.stages.push({ id: s.nextId++, ratio: 1, efficiency: 0.9 }); buildStages(app); app.changed(); });

      app.numField(lf, Object.assign({ id: 'mdF', label: 'Force F', step: 0.1, get: a => a.state.F, set: (a, v) => { a.state.F = v; } }, F.F));
      app.numField(lf, Object.assign({ id: 'mdRF', label: 'Radius r', step: 1, get: a => a.state.rF, set: (a, v) => { a.state.rF = v; } }, F.r));
      const ll = sec(''); ll.id = 'mdLLift'; ld.appendChild(ll);
      app.numField(ll, Object.assign({ id: 'mdM', label: 'Mass m', step: 0.1, get: a => a.state.m, set: (a, v) => { a.state.m = v; } }, F.m));
      app.numField(ll, Object.assign({ id: 'mdRS', label: 'Spool radius r', step: 1, get: a => a.state.rS, set: (a, v) => { a.state.rS = v; } }, F.r));
      sec('<p class="note" id="mdTLnote"></p>');
      // Target
      const tg = sec('<div class="sec-h">Target speed</div>');
      app.checkField(tg, { id: 'mdUT', label: 'Solve for a target output speed', get: a => a.state.useTarget, set: (a, v) => { a.state.useTarget = v; } });
      const tb = sec(''); tb.id = 'mdTBox'; tg.appendChild(tb);
      app.numField(tb, Object.assign({ id: 'mdNt', label: 'Target N<sub>out</sub>', step: 1, get: a => a.state.Ntarget, set: (a, v) => { a.state.Ntarget = v; } }, F.Nt));
      app.selectField(tb, { id: 'mdRnd', label: 'Round the ratio to', options: [['0.01', 'nearest 0.01'], ['0.1', 'nearest 0.1'], ['1', 'whole number'], ['pair', 'nearest gear pair'], ['exact', 'exact (no rounding)']], get: a => a.state.rounding, set: (a, v) => { a.state.rounding = v; } });
      // Compare
      sec('<div class="sec-h">Compare motors</div><div id="mdCmp"></div><div class="btnrow"><button class="btn" id="mdAddCmp" type="button">+ Add motor to compare</button></div><p class="note">Compared motors share the gearing and load.</p>');
      $('mdAddCmp').addEventListener('click', () => { const s = app.state; if (s.compare.length >= D.MAX_COMPARE) return; const second = s.compare.length === 1; s.compare.push({ id: s.nextId++, label: 'Motor ' + (s.compare.length + 2), Ts: Number((s.Ts * (second ? 1.5 : 1)).toPrecision(4)), N0: Math.round(s.N0 * (second ? 0.8 : 1.5)) }); buildCompare(app); app.changed(); });
      // VEX static pull test (spec 02a)
      const pt = sec('<div class="sec-h">Pull test (VEX)</div>');
      app.checkField(pt, { id: 'mdPull', label: 'Predict a static pulling force', get: a => a.state.pull, set: (a, v) => { a.state.pull = v; } });
      const pb = sec(''); pb.id = 'mdPullBox'; pt.appendChild(pb);
      pb.insertAdjacentHTML('beforeend', '<div class="btnrow"><button class="btn" id="mdV5" type="button">Use two V5 green motors</button></div>');
      $('mdV5').addEventListener('click', () => {
        const s = app.state, m = D.VEX_MOTORS.find(x => x.id === 'v5green');
        s.preset = m.id; s.label = m.label; s.Ts = Number((m.stallTorque / D.TORQUE_UNITS[s.TsUnit]).toPrecision(10)); s.N0 = m.noLoadSpeed; s.k = 2;
        app.refreshFields(); app.changed(); app.toast('Motor set to two ' + m.label + ' motors.');
      });
      app.selectField(pb, { id: 'mdWh', label: 'Wheel', options: Object.keys(D.WHEELS).map(k => [k, D.WHEELS[k].label]), get: a => a.state.wheel, set: (a, v) => { a.state.wheel = v; if (v !== 'custom') a.state.rW = Number(D.WHEELS[v].r.toPrecision(4)); a.refreshFields(); } });
      app.numField(pb, Object.assign({ id: 'mdRW', label: 'Wheel radius r', step: 0.5, get: a => a.state.rW, set: (a, v) => { if (v !== a.state.rW) a.state.wheel = 'custom'; a.state.rW = v; } }, F.rW));
      optField(app, pb, Object.assign({ id: 'mdMass', label: 'Vehicle mass m', get: a => a.state.mass, set: (a, v) => { a.state.mass = v; } }, F.mass));
      app.numField(pb, Object.assign({ id: 'mdFD', label: 'Weight on driven wheels f', step: 5, get: a => a.state.fDrive, set: (a, v) => { a.state.fDrive = v; } }, F.fDrive));
      optField(app, pb, Object.assign({ id: 'mdMu', label: 'Friction coefficient μ', get: a => a.state.mu, set: (a, v) => { a.state.mu = v; } }, F.mu));
      // A measurement is not a model input: it keeps a checked prediction showing and is
      // attached to the student's latest pull prediction for this design in the log.
      optField(app, pb, Object.assign({ id: 'mdFm', label: 'Measured pull', keepPrediction: true, get: a => a.state.Fmeas, set: (a, v) => { a.state.Fmeas = v; a.recordMeasured(D.PULL_QUANTITY, v); } }, F.Fmeas));
      pb.insertAdjacentHTML('beforeend', '<p class="note">Measure the mass on a scale and μ with the force sensor (see Help). The gearing above is your extra reduction, after the motor\'s cartridge.</p>');
      // Extension
      const ex = sec('<div class="sec-h">Extension: electrical</div>');
      app.checkField(ex, { id: 'mdEl', label: 'Show current and efficiency', get: a => a.state.electrical, set: (a, v) => { a.state.electrical = v; } });
      const eb = sec(''); eb.id = 'mdElBox'; ex.appendChild(eb);
      app.numField(eb, Object.assign({ id: 'mdV', label: 'Supply voltage V', step: 0.5, get: a => a.state.V, set: (a, v) => { a.state.V = v; } }, F.V));
      app.numField(eb, Object.assign({ id: 'mdI0', label: 'No-load current I<sub>0</sub>', step: 0.05, check: (v, a) => v >= a.state.Is ? 'No-load current must be less than the stall current.' : null, get: a => a.state.I0, set: (a, v) => { a.state.I0 = v; } }, F.I0));
      app.numField(eb, Object.assign({ id: 'mdIs', label: 'Stall current I<sub>s</sub>', step: 0.5, check: (v, a) => v <= a.state.I0 ? 'Stall current must be more than the no-load current.' : null, get: a => a.state.Is, set: (a, v) => { a.state.Is = v; } }, F.Is));
      eb.insertAdjacentHTML('beforeend', '<p class="note">Values from your motor\'s datasheet. The starting values are examples.</p>');
      // Stage
      app.el.stage.innerHTML = '<div class="drawcard" id="mdDraw"></div><p class="cap">Drag across the plot, or use the arrow keys on it, to change the load torque. The operating point slides along the motor line. Compared motors use dashed and dotted lines.</p>';
      wirePlot(app);
      buildStages(app); buildCompare(app);
    },
    render(app) {
      const s = app.state;
      app.fields.forEach(f => { if (/^(mdI0|mdIs)$/.test(f.o.id)) f.revalidate(); });
      SOL = app.hasInvalid() ? null : D.solve(s, bands(app));
      $('mdLTorque').hidden = s.loadType !== 'torque';
      $('mdLForce').hidden = s.loadType !== 'force';
      $('mdLLift').hidden = s.loadType !== 'lift';
      $('mdTBox').hidden = !s.useTarget;
      $('mdElBox').hidden = !s.electrical;
      $('mdPullBox').hidden = !s.pull;
      $('mdTsU').value = s.TsUnit;
      $('mdTLnote').textContent = SOL && s.loadType !== 'torque' ? 'Load torque T_L = ' + app.fmtU(SOL.TL, 'N·m') + '.' : '';
      $('mdOverall').textContent = SOL ? 'Overall i = ' + app.fmt(SOL.g.i) + ', η = ' + app.fmt(SOL.g.eta) : '';
      const card = $('mdDraw'), focus = document.activeElement && document.activeElement.id === 'mdSvg';
      card.innerHTML = draw(app).svg;
      if (focus) { const f = $('mdSvg'); if (f) f.focus({ preventScroll: true }); }
      results(app);
      app.setWorking(SOL ? D.working(SOL, app.fmt, app.fmtU) : []);
      app.describe(SOL ? D.describe(SOL, app.fmtU, app.masked()) : 'The plot cannot update until the highlighted input is fixed.');
    },
    drawing: (app, opts) => draw(app, opts),
    predictTargets: app => SOL ? D.targets(SOL) : [],
    inputsSnapshot: app => D.snapshot(app.state),
    report(app) {
      const s = app.state, sol = SOL, fu = app.fmtU, m = app.masked();
      const hide = v => m ? 'hidden until checked' : v;
      const inputs = [['Motor', esc(s.label) + (s.preset === 'example' ? ' (example, not a real product)' : '')], ['Stall torque', fu(s.Ts, s.TsUnit) + (s.TsUnit !== 'N·m' && sol ? ' = ' + fu(sol.Ts, 'N·m') : '')], ['No-load speed', fu(s.N0, 'rpm')], ['Motors in parallel', String(s.k)]];
      s.stages.forEach((x, i) => inputs.push(['Stage ' + (i + 1), 'ratio ' + app.fmt(x.ratio) + ', efficiency ' + app.fmt(x.efficiency)]));
      inputs.push(['Load', s.loadType === 'torque' ? fu(s.TL, 'N·m') : s.loadType === 'force' ? fu(s.F, 'N') + ' at ' + fu(s.rF, 'mm') : fu(s.m, 'kg') + ' on a ' + fu(s.rS, 'mm') + ' spool']);
      if (s.useTarget) inputs.push(['Target output speed', fu(s.Ntarget, 'rpm') + ', rounded to ' + s.rounding]);
      if (s.pull) inputs.push(['Pull test', D.WHEELS[s.wheel].label + ', r = ' + fu(D.wheelR(s) * 1000, 'mm') + '; mass ' + (s.mass === null ? 'blank' : fu(s.mass, 'kg')) + ', ' + app.fmt(s.fDrive) + '% on driven wheels; μ ' + (s.mu === null ? 'blank' : app.fmt(s.mu)) + (s.Fmeas === null ? '' : '; measured ' + fu(s.Fmeas, 'N'))]);
      if (s.electrical) inputs.push(['Electrical', fu(s.V, 'V') + ', I₀ ' + fu(s.I0, 'A') + ', I_s ' + fu(s.Is, 'A')]);
      const outputs = [];
      if (sol) {
        const op = sol.op;
        outputs.push(['Overall ratio, efficiency', app.fmt(sol.g.i) + ', ' + app.fmt(sol.g.eta)], ['Load torque T<sub>L</sub>', fu(sol.TL, 'N·m')], ['Motor torque', hide(fu(op.Tm, 'N·m') + ' (' + (app.fmt(op.pct) + '% of stall') + ')')], ['Motor speed', hide(fu(sol.Nm, 'rpm'))], ['Output speed', hide(fu(sol.Nout, 'rpm'))], ['Output power / peak', hide(fu(op.Pout, 'W')) + ' / ' + fu(sol.Pmax, 'W')], ['Duty range', hide(D.BAND_TEXT[op.band])]);
        if (sol.solver) {
          if (!sol.solver.feasible) outputs.push(['Ratio solver', hide('no ratio reaches the target at this load')]);
          else outputs.push(['Recommended ratio', hide(app.fmt(sol.solver.iHigh))], ['Other root', hide(sol.solver.iLow ? app.fmt(sol.solver.iLow) + ' (' + (app.fmt(sol.solver.pctLow) + '% of stall') + ')' : 'none')], ['Rounded ratio', hide(app.fmt(sol.rounded.ratio) + ' → ' + fu(sol.rounded.Nout, 'rpm') + ', error ' + app.fmt(sol.rounded.err) + '%')]);
        }
        if (sol.elec) outputs.push(['Current, power in, efficiency', hide(fu(sol.elec.I, 'A') + ', ' + fu(sol.elec.Pin, 'W') + ', ' + (sol.elec.eff === null ? 'not defined' : (app.fmt(sol.elec.eff * 100) + '%')))]);
        if (sol.pull) {
          const pu = sol.pull;
          outputs.push(['Predicted pull', hide(fu(pu.F, 'N') + ', ' + D.LIMIT_TEXT[pu.limit].toLowerCase())], ['Motor-limited pull', hide(fu(pu.Fmotor, 'N'))]);
          if (pu.traction) outputs.push(['Traction-limited pull', hide(fu(pu.Ftraction, 'N'))], ['Crossover ratio i*', hide(app.fmt(pu.iStar))], ['Mass for the motors to limit', hide(pu.mStar === null ? 'not defined: friction is zero' : fu(pu.mStar, 'kg'))]);
          if (s.Fmeas !== null) outputs.push(['Measured pull', hide(fu(s.Fmeas, 'N') + (pu.measPct === null ? '' : ' (' + app.fmt(pu.measPct) + '% from the model)'))]);
        }
        sol.compare.forEach(c => outputs.push(['Compare: ' + esc(c.c.label), hide((app.fmt(c.op.pct) + '% of stall') + ', ' + fu(c.Nout, 'rpm'))]));
      } else outputs.push(['Results', app.invalidReason()]);
      return { inputs, outputs, notes: s.preset === 'example' ? ['Example motor (not a real product).'] : [] };
    },
  });
})();
</script>
</body>
</html>
